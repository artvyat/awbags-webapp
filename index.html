<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Around The World</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

  <!-- ЭКРАН 1: КАТАЛОГ -->
  <section id="screen-catalog" class="screen active">
    <header class="topbar">
      <h1 class="topbar-title">Каталог</h1>
      <p class="topbar-subtitle">Выбери сумку для именной вышивки</p>
    </header>
    <div id="catalog-grid" class="catalog-grid"></div>
  </section>

  <!-- ЭКРАН 2: КОНСТРУКТОР -->
  <section id="screen-builder" class="screen">
    <header class="topbar">
      <button id="btn-back" class="btn-back" aria-label="Назад">‹</button>
      <h1 id="builder-title" class="topbar-title">—</h1>
      <p id="builder-subtitle" class="topbar-subtitle">—</p>
    </header>

    <div class="preview-block">
      <img id="preview-img" class="preview-img" alt="">
    </div>

    <div class="form-block">
      <label class="form-label" for="text-input">
        Текст вышивки
        <span class="form-hint" id="text-hint">до 12 символов</span>
      </label>
      <input
        id="text-input"
        type="text"
        class="form-input"
        placeholder="Например: Москва"
        maxlength="12"
        autocomplete="off"
        autocapitalize="words"
      >
      <div class="form-error" id="text-error"></div>
    </div>

    <div class="form-block">
      <label class="form-label">Цвет ниток</label>
      <div id="color-grid" class="color-grid"></div>
      <div class="selected-color-name" id="selected-color-name">—</div>
    </div>

    <div class="bottom-bar">
      <button id="btn-submit" class="btn-primary" disabled>Готово ✓</button>
    </div>
  </section>

  <script src="app.js?v=5"></script>
</body>
</html>
